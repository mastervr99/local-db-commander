services:
  postgres-mcp:
    image: postgres:16-alpine
    container_name: mcp_postgres_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: inventory_db
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mcp-server:
    build: .
    container_name: mcp_server
    ports: 
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:password123@postgres-mcp:5432/inventory_db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - postgres-mcp
    restart: always

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always 

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open_webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_FUNCTION_CALLING=True
      - FUNCTION_CALLING_ENGINE=ollama
      - ENABLE_MCP=True
      - DEBUG=True
    depends_on:
      - ollama
      - mcp-server
    volumes:
      - open_webui_data:/app/backend/data
    restart: always

volumes:
  postgres_data:
  open_webui_data:
  ollama_data: